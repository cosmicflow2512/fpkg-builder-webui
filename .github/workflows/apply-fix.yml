name: Apply fix

on:
  push:
    paths:
      - .github/workflows/apply-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and remove temporary workflow
