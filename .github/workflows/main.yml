name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cosmicflow2512/fpkg-builder-webui

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -f Dockerfile.webui -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Publish image
        run: docker push "$IMAGE_NAME:latest" && docker push "$IMAGE_NAME:${{ github.sha }}"
