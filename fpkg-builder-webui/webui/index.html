<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fPKG Builder</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel intro">
        <div>
          <p class="eyebrow">Unraid WebUI</p>
          <h1>fPKG Builder</h1>
        </div>
        <div id="runtime" class="runtime">Checking runtime...</div>
      </section>

      <section class="panel">
        <form id="build-form" class="form">
          <div class="grid">
            <label>
              <span>Game folder</span>
              <input name="gameFolder" autocomplete="off" placeholder="/mnt/user/games/PPSA12345-app">
            </label>
            <label>
              <span>Backport folder</span>
              <input name="backportFolder" autocomplete="off" placeholder="/mnt/user/backports/PPSA12345">
            </label>
            <label>
              <span>Output folder</span>
              <input name="outputFolder" autocomplete="off" required placeholder="/mnt/user/fpkg-output">
            </label>
            <label>
              <span>Work folder</span>
              <input name="workFolder" autocomplete="off" placeholder="/mnt/cache/appdata/fpkg-builder/work">
            </label>
            <label>
              <span>Name</span>
              <input name="name" autocomplete="off" placeholder="Defaults to titleId">
            </label>
            <label>
              <span>Content version</span>
              <input name="contentVersion" autocomplete="off" placeholder="Auto-bump">
            </label>
            <label>
              <span>Toolkit root</span>
              <input name="toolkitRoot" autocomplete="off" placeholder="Optional mounted toolkit path">
            </label>
            <label>
              <span>Temp directory</span>
              <input name="temporaryDirectory" autocomplete="off" placeholder="Optional publisher temp path">
            </label>
          </div>

          <div class="options">
            <label>
              <span>Compression</span>
              <select name="compressionLevel"></select>
            </label>
            <label class="check"><input type="checkbox" name="rebuildBase"> Rebuild base</label>
            <label class="check"><input type="checkbox" name="keepWork"> Keep work</label>
            <label class="check"><input type="checkbox" name="force"> Overwrite output</label>
          </div>

          <div class="actions">
            <button type="submit" id="start">Start build</button>
            <button type="button" id="cancel" disabled>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel log-panel">
        <div class="log-head">
          <h2>Job log</h2>
          <span id="job-state">Idle</span>
        </div>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
