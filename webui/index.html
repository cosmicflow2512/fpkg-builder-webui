<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fPKG Builder</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel intro">
        <div>
          <p class="eyebrow">Unraid WebUI</p>
          <h1>fPKG Builder</h1>
        </div>
        <div id="runtime" class="runtime">Checking runtime...</div>
      </section>

      <section class="panel">
        <div class="tabs">
          <button type="button" class="tab active" data-tab="build">Build</button>
          <button type="button" class="tab" data-tab="archive">Archive Build</button>
          <button type="button" class="tab" data-tab="extract">Extract</button>
        </div>

        <form id="build-form" class="form">
          <div class="grid">
            <label>
              <span>Game folder</span>
              <div class="path-row">
                <input name="gameFolder" autocomplete="off" placeholder="/mnt/user/games/PPSA12345-app">
                <button type="button" class="browse" data-target="gameFolder" data-type="dir">Browse</button>
              </div>
            </label>
            <label>
              <span>Backport folder</span>
              <div class="path-row">
                <input name="backportFolder" autocomplete="off" placeholder="/mnt/user/backports/PPSA12345">
                <button type="button" class="browse" data-target="backportFolder" data-type="dir">Browse</button>
              </div>
            </label>
            <label>
              <span>Output folder</span>
              <div class="path-row">
                <input name="outputFolder" autocomplete="off" required placeholder="/mnt/user/fpkg-output">
                <button type="button" class="browse" data-target="outputFolder" data-type="dir">Browse</button>
              </div>
            </label>
            <label>
              <span>Work folder</span>
              <div class="path-row">
                <input name="workFolder" autocomplete="off" placeholder="/mnt/cache/appdata/fpkg-builder/work">
                <button type="button" class="browse" data-target="workFolder" data-type="dir">Browse</button>
              </div>
            </label>
            <label>
              <span>Name</span>
              <input name="name" autocomplete="off" placeholder="Defaults to titleId">
            </label>
            <label>
              <span>Content version</span>
              <input name="contentVersion" autocomplete="off" placeholder="Auto-bump">
            </label>
            <label>
              <span>Toolkit root</span>
              <input name="toolkitRoot" autocomplete="off" placeholder="Optional mounted toolkit path">
            </label>
            <label>
              <span>Temp directory</span>
              <input name="temporaryDirectory" autocomplete="off" placeholder="Optional publisher temp path">
            </label>
          </div>

          <div class="options">
            <label>
              <span>Compression</span>
              <select name="compressionLevel"></select>
            </label>
            <label class="check"><input type="checkbox" name="rebuildBase"> Rebuild base</label>
            <label class="check"><input type="checkbox" name="keepWork"> Keep work</label>
            <label class="check"><input type="checkbox" name="force"> Overwrite output</label>
          </div>

          <div class="actions">
            <button type="submit" id="start">Start build</button>
            <button type="button" id="cancel" disabled>Cancel</button>
          </div>
        </form>

        <form id="archive-form" class="form hidden">
          <div class="grid">
            <label>
              <span>Main archive</span>
              <div class="path-row">
                <input name="archive" autocomplete="off" required placeholder="/mnt/user/NZB/fpkg-fixes/backport.zip">
                <button type="button" class="browse" data-target="archive" data-type="file">Browse</button>
              </div>
            </label>
            <label>
              <span>Output folder</span>
              <div class="path-row">
                <input name="outputFolder" autocomplete="off" required value="/mnt/user/fpkg-output">
                <button type="button" class="browse" data-target="outputFolder" data-type="dir">Browse</button>
              </div>
            </label>
            <label>
              <span>Base PKG</span>
              <div class="path-row">
                <input name="basePackage" autocomplete="off" placeholder="/mnt/user/fpkg-output/PPSA12345.pkg">
                <button type="button" class="browse" data-target="basePackage" data-type="file">Browse</button>
              </div>
            </label>
            <label>
              <span>Game archive</span>
              <div class="path-row">
                <input name="gameArchive" autocomplete="off" placeholder="/mnt/user/NZB/fpkg-fixes/game-dump.zip">
                <button type="button" class="browse" data-target="gameArchive" data-type="file">Browse</button>
              </div>
            </label>
            <label>
              <span>Game folder</span>
              <div class="path-row">
                <input name="gameFolder" autocomplete="off" placeholder="/mnt/user/games/PPSA12345-app">
                <button type="button" class="browse" data-target="gameFolder" data-type="dir">Browse</button>
              </div>
            </label>
            <label>
              <span>Name</span>
              <input name="name" autocomplete="off" placeholder="Auto from Base PKG or titleId">
            </label>
          </div>

          <div class="options">
            <label>
              <span>Compression</span>
              <select name="compressionLevel"></select>
            </label>
            <label class="check"><input type="checkbox" name="keepWork"> Keep work</label>
            <label class="check"><input type="checkbox" name="force"> Overwrite output</label>
          </div>

          <div class="actions">
            <button type="submit" id="archive-start">Unpack and build</button>
          </div>
        </form>

        <form id="extract-form" class="form hidden">
          <div class="grid">
            <label>
              <span>Package</span>
              <div class="path-row">
                <input name="package" autocomplete="off" required placeholder="/mnt/user/fpkg-output/PPSA12345.pkg">
                <button type="button" class="browse" data-target="package" data-type="file">Browse</button>
              </div>
            </label>
            <label>
              <span>Extract into</span>
              <div class="path-row">
                <input name="destination" autocomplete="off" required placeholder="/mnt/user/fpkg-output/extracted/PPSA12345">
                <button type="button" class="browse" data-target="destination" data-type="dir">Browse</button>
              </div>
            </label>
          </div>

          <div class="actions">
            <button type="submit" id="extract">Extract package</button>
          </div>
        </form>
      </section>

      <section class="panel log-panel">
        <div class="log-head">
          <h2>Job log</h2>
          <span id="job-state">Idle</span>
        </div>
        <pre id="log"></pre>
      </section>
    </main>
    <dialog id="browser">
      <div class="browser-head">
        <strong>Select path</strong>
        <button type="button" id="browser-close">Close</button>
      </div>
      <div id="browser-path"></div>
      <div id="browser-roots"></div>
      <div id="browser-list"></div>
      <div class="browser-actions">
        <button type="button" id="browser-select">Use current folder</button>
      </div>
    </dialog>
    <script src="/static/app.js"></script>
  </body>
</html>
